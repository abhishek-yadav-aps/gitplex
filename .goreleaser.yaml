version: 2

project_name: gitplex

before:
  hooks:
    - go mod tidy

builds:
  - id: gitplex
    main: ./cmd/gitplex
    binary: gitplex
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: gitplex
    ids:
      - gitplex
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: gitplex
    ids:
      - gitplex
    binaries:
      - gitplex
    repository:
      owner: abhishek-yadav-aps
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Update gitplex Homebrew cask to {{ .Tag }}"
    homepage: "https://github.com/abhishek-yadav-aps/gitplex"
    description: "Create a generated multi-repo working directory"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
