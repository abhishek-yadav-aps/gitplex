version: 2

project_name: gitplex

release:
  extra_files:
    - glob: editors/vscode/gitplex-ownership.vsix

before:
  hooks:
    - go mod tidy

builds:
  - id: gitplex
    main: ./cmd/gitplex
    binary: gitplex
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: gitplex
    ids:
      - gitplex
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
